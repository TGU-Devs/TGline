openapi: 3.0.3
info:
  title: TGU API
  description: 東北学院大学 学内情報共有掲示板 API
  version: 1.0.0
  contact:
    name: TGU Devs

servers:
  - url: http://localhost:3001
    description: Development
  - url: https://your-production-url.railway.app
    description: Production

tags:
  - name: Authentication
    description: ユーザー認証（サインイン・サインアップ・サインアウト）
  - name: Google OAuth
    description: Googleアカウントによる認証
  - name: User
    description: ユーザー情報の取得・更新
  - name: Password
    description: パスワード変更・リセット
  - name: Post
    description: 投稿のCRUD
  - name: Like
    description: いいね機能
  - name: Comment
    description: コメント機能
  - name: Notification
    description: いいね・コメントのアプリ内通知
  - name: Tag
    description: タグ一覧
  - name: Course
    description: 授業・開講情報・授業レビュー
  - name: Admin
    description: 管理者専用エンドポイント
  - name: Misc
    description: その他

paths:
  # ============================================================
  # Authentication
  # ============================================================
  /api/users/sign_up:
    post:
      tags: [Authentication]
      summary: ユーザー登録
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user:
                  type: object
                  required: [email, password, password_confirmation, display_name]
                  properties:
                    email:
                      type: string
                      format: email
                      example: user@tgu.ac.jp
                    password:
                      type: string
                      minLength: 8
                      description: 大文字・小文字・数字を含む8文字以上
                      example: Password1
                    password_confirmation:
                      type: string
                      example: Password1
                    display_name:
                      type: string
                      maxLength: 20
                      example: テストユーザー
                    description:
                      type: string
                      maxLength: 200
                      example: よろしくお願いします
      responses:
        '201':
          description: 登録成功
          headers:
            Set-Cookie:
              description: JWT httpOnly cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'

  /api/users/sign_in:
    post:
      tags: [Authentication]
      summary: サインイン
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session]
              properties:
                session:
                  type: object
                  required: [email, password]
                  properties:
                    email:
                      type: string
                      format: email
                      example: admin@tgu.ac.jp
                    password:
                      type: string
                      example: admin123
      responses:
        '200':
          description: サインイン成功
          headers:
            Set-Cookie:
              description: JWT httpOnly cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/sign_out:
    delete:
      tags: [Authentication]
      summary: サインアウト
      operationId: signOut
      responses:
        '204':
          description: サインアウト成功（cookieを削除）

  /api/users/google_sign_in:
    post:
      tags: [Google OAuth]
      summary: Googleアカウントでサインイン
      operationId: googleSignIn
      description: |
        Google Identity ServicesのIDトークンを使用してサインイン/サインアップする。
        ユーザーが存在しない場合は自動的に作成される。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token:
                  type: string
                  description: Google ID Token
      responses:
        '200':
          description: サインイン成功
          headers:
            Set-Cookie:
              description: JWT httpOnly cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 無効なトークン
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: メールアドレスが既にメール/パスワードで登録済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================
  # Current User (me)
  # ============================================================
  /api/users/me:
    get:
      tags: [User]
      summary: 現在のユーザー情報を取得
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [User]
      summary: プロフィールを更新
      operationId: updateMe
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    display_name:
                      type: string
                      maxLength: 20
                    description:
                      type: string
                      maxLength: 200
                    email:
                      type: string
                      format: email
                    notify_email:
                      type: boolean
                      description: メール通知のマスタースイッチ。false のときはいいね・コメントのメールを送らない
                    notify_email_like:
                      type: boolean
                      description: いいねのメール通知
                    notify_email_comment:
                      type: boolean
                      description: コメントのメール通知
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'

    delete:
      tags: [User]
      summary: アカウントを削除（論理削除）
      operationId: deleteMe
      security:
        - cookieAuth: []
      description: OAuthユーザーはパスワード不要。メール/パスワードユーザーは現在のパスワードが必要。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: object
                  properties:
                    current_password:
                      type: string
                      description: メール/パスワードユーザーのみ必須
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # Password
  # ============================================================
  /api/users/password:
    patch:
      tags: [Password]
      summary: パスワードを変更
      operationId: changePassword
      security:
        - cookieAuth: []
      description: OAuthユーザーは使用不可（403）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: object
                  required: [current_password, new_password]
                  properties:
                    current_password:
                      type: string
                    new_password:
                      type: string
                      minLength: 8
                      description: 大文字・小文字・数字を含む8文字以上
      responses:
        '200':
          description: 変更成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: パスワードを変更しました
        '401':
          description: 現在のパスワードが間違っている
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: OAuthユーザーのためパスワード変更不可
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/password_reset:
    post:
      tags: [Password]
      summary: パスワードリセットメールを送信
      operationId: requestPasswordReset
      description: アカウント列挙防止のため、メールアドレスの存在有無に関わらず常に200を返す
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_reset]
              properties:
                password_reset:
                  type: object
                  required: [email]
                  properties:
                    email:
                      type: string
                      format: email
      responses:
        '200':
          description: リクエスト受付（メールが存在しない場合も同じレスポンス）
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    patch:
      tags: [Password]
      summary: パスワードをリセット（トークン使用）
      operationId: resetPassword
      description: リセット完了後、自動的にサインインする
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_reset]
              properties:
                password_reset:
                  type: object
                  required: [reset_password_token, password, password_confirmation]
                  properties:
                    reset_password_token:
                      type: string
                    password:
                      type: string
                      minLength: 8
                    password_confirmation:
                      type: string
      responses:
        '200':
          description: リセット成功（自動サインイン）
          headers:
            Set-Cookie:
              description: JWT httpOnly cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: 無効なトークンまたはバリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'

  # ============================================================
  # Users (public)
  # ============================================================
  /api/users:
    get:
      tags: [User]
      summary: ユーザー一覧を取得
      operationId: listUsers
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'

  /api/users/{id}:
    get:
      tags: [User]
      summary: ユーザー詳細を取得
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: ユーザーが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================
  # Posts
  # ============================================================
  /api/posts:
    get:
      tags: [Post]
      summary: 投稿一覧を取得
      operationId: listPosts
      description: 20件ずつページネーション。認証なしでもアクセス可能。
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: ページ番号
        - name: category
          in: query
          schema:
            type: string
            enum: [faculty, topic]
          description: タグカテゴリでフィルタ
        - name: tag_id
          in: query
          schema:
            type: integer
          description: 特定のタグIDでフィルタ
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  has_next:
                    type: boolean
                    description: 次のページが存在するか

    post:
      tags: [Post]
      summary: 投稿を作成
      operationId: createPost
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post]
              properties:
                post:
                  type: object
                  required: [title, body]
                  properties:
                    title:
                      type: string
                      maxLength: 100
                      example: テスト投稿
                    body:
                      type: string
                      maxLength: 10000
                      example: これはテスト投稿です。
                    tag_ids:
                      type: array
                      items:
                        type: integer
                      description: タグIDの配列（学部タグは最大1つ）
                      example: [1, 10]
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'

  /api/posts/{id}:
    get:
      tags: [Post]
      summary: 投稿詳細を取得
      operationId: getPost
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 投稿が見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'

    patch:
      tags: [Post]
      summary: 投稿を更新
      operationId: updatePost
      security:
        - cookieAuth: []
      description: 投稿者本人のみ更新可能
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post]
              properties:
                post:
                  type: object
                  properties:
                    title:
                      type: string
                      maxLength: 100
                    body:
                      type: string
                      maxLength: 10000
                    tag_ids:
                      type: array
                      items:
                        type: integer
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 権限なし（投稿者本人ではない）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 投稿が見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'

    delete:
      tags: [Post]
      summary: 投稿を削除（論理削除）
      operationId: deletePost
      security:
        - cookieAuth: []
      description: 投稿者本人または管理者が削除可能
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 投稿が見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'

  # ============================================================
  # Likes
  # ============================================================
  /api/posts/{post_id}/likes:
    post:
      tags: [Like]
      summary: いいねする
      operationId: createLike
      security:
        - cookieAuth: []
      description: 投稿者以外のいいねでは投稿者向けのアプリ内通知を作成し、設定に応じてメールを送信する。自分の投稿へのいいねでは通知しない。
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '201':
          description: いいね成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 投稿が見つからない
        '422':
          description: 既にいいね済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'

    delete:
      tags: [Like]
      summary: いいねを取り消す
      operationId: deleteLike
      security:
        - cookieAuth: []
      description: 関連する通知も削除する
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '204':
          description: いいね取り消し成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: いいねが見つからない

  # ============================================================
  # Comments
  # ============================================================
  /api/posts/{post_id}/comments:
    get:
      tags: [Comment]
      summary: コメント一覧を取得
      operationId: listComments
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 投稿が見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'

    post:
      tags: [Comment]
      summary: コメントを作成
      operationId: createComment
      security:
        - cookieAuth: []
      description: 投稿者以外のコメントでは投稿者向けのアプリ内通知を作成し、設定に応じてメールを送信する。自分の投稿へのコメントでは通知しない。
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: object
                  required: [body]
                  properties:
                    body:
                      type: string
                      maxLength: 1000
                      example: 参考になります！
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 投稿が見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'

  /api/posts/{post_id}/comments/{id}:
    delete:
      tags: [Comment]
      summary: コメントを削除（論理削除）
      operationId: deleteComment
      security:
        - cookieAuth: []
      description: コメント投稿者本人または管理者が削除可能。関連する通知も削除する。
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: コメントID
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 投稿またはコメントが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'

  # ============================================================
  # Notifications
  # ============================================================
  /api/notifications:
    get:
      tags: [Notification]
      summary: 通知一覧を取得
      operationId: listNotifications
      security:
        - cookieAuth: []
      description: 自分宛の通知を新しい順に20件ずつ返す。
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: ページ番号
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/notifications/unread_count:
    get:
      tags: [Notification]
      summary: 未読通知数を取得
      operationId: getUnreadNotificationCount
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadNotificationCount'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/notifications/read_all:
    post:
      tags: [Notification]
      summary: 未読通知をすべて既読にする
      operationId: readAllNotifications
      security:
        - cookieAuth: []
      responses:
        '204':
          description: 成功
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/notifications/{id}/read:
    post:
      tags: [Notification]
      summary: 通知を既読にする
      operationId: readNotification
      security:
        - cookieAuth: []
      description: 自分宛の通知のみ既読にできる。
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 通知が見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================
  # Tags
  # ============================================================
  /api/tags:
    get:
      tags: [Tag]
      summary: タグ一覧を取得
      operationId: listTags
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [faculty, topic]
          description: カテゴリでフィルタ
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'

  # ============================================================
  # Courses
  # ============================================================
  /api/courses:
    get:
      tags: [Course]
      summary: 授業一覧を取得
      operationId: listCourses
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: 授業名・教員名・対象学部・対象学科の部分一致
        - name: faculty
          in: query
          schema:
            type: string
        - name: department
          in: query
          schema:
            type: string
        - name: target_grade
          in: query
          schema:
            type: string
            enum: [all_grades, first_year, second_year, third_year, fourth_year]
          description: 指定学年に加えて全学年対象の授業も含める
        - name: category
          in: query
          schema:
            type: string
        - name: academic_year
          in: query
          schema:
            type: integer
        - name: semester
          in: query
          schema:
            type: string
            enum: [first, second, full_year, intensive, other]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
