# ============================================================
# Components
# ============================================================
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: jwt_token
      description: httpOnly JWT cookie（サインイン時に自動設定）

  parameters:
    PostId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: 投稿ID

    PostIdPath:
      name: post_id
      in: path
      required: true
      schema:
        type: integer
      description: 投稿ID

    CourseId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: 授業ID

    CourseIdPath:
      name: course_id
      in: path
      required: true
      schema:
        type: integer
      description: 授業ID

    CourseReviewId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: 授業レビューID

    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: 通知ID

  responses:
    Unauthorized:
      description: 未認証（トークンなしまたは期限切れ）
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                enum: [unauthorized, token_expired]

  schemas:
    # ----------------------------------------------------------
    # Auth
    # ----------------------------------------------------------
    AuthResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
              format: email
            display_name:
              type: string
            role:
              type: string
              enum: [user, admin]
        token:
          type: string
          description: JWT（cookieにも設定される）
        message:
          type: string

    # ----------------------------------------------------------
    # User
    # ----------------------------------------------------------
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        display_name:
          type: string
        description:
          type: string
          nullable: true
        role:
          type: string
          enum: [user, admin]
        provider:
          type: string
          nullable: true
          description: OAuthプロバイダー（google等）。メール/パスワードユーザーはnull
        created_at:
          type: string
          format: date-time
        notify_email:
          type: boolean
          description: メール通知のマスタースイッチ。false のときはいいね・コメントのメールを送らない
        notify_email_like:
          type: boolean
          description: いいねのメール通知
        notify_email_comment:
          type: boolean
          description: コメントのメール通知

    UserSummary:
      type: object
      properties:
        id:
          type: integer
        display_name:
          type: string
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        display_name:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # ----------------------------------------------------------
    # Post
    # ----------------------------------------------------------
    Post:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        user:
          type: object
          nullable: true
          description: 論理削除されたユーザーの場合null
          properties:
            id:
              type: integer
            display_name:
              type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        likes_count:
          type: integer
        current_user_liked:
          type: boolean
          description: 現在のユーザーがいいね済みか（未認証時はfalse）
        comments_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ----------------------------------------------------------
    # Comment
    # ----------------------------------------------------------
    Comment:
      type: object
      properties:
        id:
          type: integer
        body:
          type: string
        user:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            display_name:
              type: string
        created_at:
          type: string
          format: date-time

    # ----------------------------------------------------------
    # Notification
    # ----------------------------------------------------------
    Notification:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [like, comment]
        read:
          type: boolean
        message:
          type: string
          example: 太郎があなたの投稿「ミクロ経済学の課題」にいいねしました
        actor:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            display_name:
              type: string
            avatar:
              type: object
              nullable: true
              description: 未設定時はnull
              properties:
                url:
                  type: string
                content_type:
                  type: string
                byte_size:
                  type: integer
        post_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time

    NotificationList:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        has_next_page:
          type: boolean
          description: 次のページが存在するか

    UnreadNotificationCount:
      type: object
      properties:
        count:
          type: integer
          description: 未読通知の総数

    # ----------------------------------------------------------
    # Tag
    # ----------------------------------------------------------
    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: 情報学部
        category:
          type: string
          enum: [faculty, topic]

    # ----------------------------------------------------------
    # Course
    # ----------------------------------------------------------
    CourseOffering:
      type: object
      properties:
        id:
          type: integer
        academic_year:
          type: integer
          nullable: true
        semester:
          type: string
          enum: [first, second, full_year, intensive, other]
        teacher_name:
          type: string
        day_of_week:
          type: string
          nullable: true
          enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday, other_day]
        delivery_method:
          type: string
          enum: [in_person, remote]
        target_grade:
          type: string
          enum: [all_grades, first_year, second_year, third_year, fourth_year]
        faculty:
          type: string
          nullable: true
          description: 教養科目ではnull
        department:
          type: string
          nullable: true
          description: 教養科目ではnull
        period:
          type: integer
          nullable: true
        campus:
          type: string
        classroom:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminCourseOffering:
      allOf:
        - $ref: '#/components/schemas/CourseOffering'
        - type: object
          properties:
            course:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string

    CourseOfferingInput:
      type: object
      required:
        - teacher_name
      properties:
        academic_year:
          type: integer
          nullable: true
        semester:
          type: string
          enum: [first, second, full_year, intensive, other]
        teacher_name:
          type: string
        day_of_week:
          type: string
          nullable: true
          enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday, other_day]
        delivery_method:
          type: string
          enum: [in_person, remote]
        target_grade:
          type: string
          enum: [all_grades, first_year, second_year, third_year, fourth_year]
        faculty:
          type: string
          nullable: true
          description: 教養科目では送信不要。それ以外は必須
        department:
          type: string
          nullable: true
          description: 教養科目では送信不要。それ以外は必須
        period:
          type: integer
          nullable: true
        campus:
          type: string
        classroom:
          type: string
          nullable: true

    Course:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        created_by_id:
          type: integer
          nullable: true
        can_manage:
          type: boolean
        primary_course_offering:
          allOf:
            - $ref: '#/components/schemas/CourseOffering'
          nullable: true
        reviews_count:
          type: integer
        average_rating:
          type: number
          nullable: true
          description: 総合評価の平均。1が不満、5がとても満足
        average_difficulty:
          type: number
          nullable: true
          description: 授業難易度の平均。1が難しい、5が易しい
        average_workload:
          type: number
          nullable: true
          description: 課題量の平均。1が多い、5が少ない
        average_grading:
          type: number
          nullable: true
          description: 単位の取りやすさの平均。1が取りにくい、5が取りやすい
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminCourseInput:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
        category:
          type: string
          enum: [教養科目, 専門科目, 外国語科目, 教職科目]

    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/Course'
        - type: object
          properties:
            course_offerings:
              type: array
              items:
                $ref: '#/components/schemas/CourseOffering'

    CourseReviewInput:
      type: object
      required:
        - course_offering_id
        - rating
        - difficulty
        - workload
        - grading
        - exam_presence
        - attendance_check
        - textbook_required
      properties:
        course_offering_id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: 総合評価。1が不満、5がとても満足
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
          description: 授業の難易度。1が難しい、5が易しい
        workload:
          type: integer
          minimum: 1
          maximum: 5
          description: 課題量。1が多い、5が少ない
        grading:
          type: integer
          minimum: 1
          maximum: 5
          description: 単位の取りやすさ。1が取りにくい、5が取りやすい
        exam_presence:
          type: string
          enum: [none, sometimes, yes]
        attendance_check:
          type: string
          enum: [none, sometimes, yes]
        textbook_required:
          type: boolean
        comment:
          type: string
          nullable: true

    CourseReview:
      allOf:
        - $ref: '#/components/schemas/CourseReviewInput'
        - type: object
          properties:
            id:
              type: integer
            course_id:
              type: integer
            user:
              type: object
              properties:
                id:
                  type: integer
                display_name:
                  type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    # ----------------------------------------------------------
    # Admin
    # ----------------------------------------------------------
    AdminStats:
      type: object
      properties:
        counts:
          type: object
          properties:
            users:
              type: integer
            posts:
              type: integer
            comments:
              type: integer
        trends:
          type: object
          properties:
            users_today:
              type: integer
            users_this_week:
              type: integer
            posts_today:
